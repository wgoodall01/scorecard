name = "scorecard"
main = "pkg/api/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
account_id = "dfd083c9490364800d31a6e3a745ad6c"
# Serve the deployed Worker at the production custom domain so it's the
# canonical URL and WebAuthn passkeys bind to the scorecard.wg.gay origin
# (rpID). Requires the wg.gay zone on this account; provisioned on
# `wrangler deploy`. Disabling workers.dev keeps *.workers.dev from being a
# second origin. (Routes are ignored by `wrangler dev` — local is unaffected.)
workers_dev = false

[[routes]]
pattern = "scorecard.wg.gay"
custom_domain = true

[assets]
directory = "pkg/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scorecard"
database_id = "d4bcf0fb-b79d-42bf-b7d7-4820fbe8ce30"
migrations_dir = "pkg/api/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "scorecard"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "817364291"

[ratelimits.simple]
# Throttle authentication-code requests.
limit = 10
period = 10

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@scorecard.wg.gay"]

# Weekly cleanup: the scheduled handler in pkg/api/index.ts prunes expired
# invite rows (Sundays 00:00 UTC).
[triggers]
crons = ["0 0 * * *"]

[[queues.producers]]
binding = "JOB_QUEUE"
queue = "scorecard-jobs"

[[queues.consumers]]
queue = "scorecard-jobs"
# One job at a time, no batching: dispatch each message as soon as it arrives.
max_batch_size = 1
max_batch_timeout = 0
# Retries disabled for now: the framework always acks once a job reaches a
# terminal state (ok/error), and per-job concerns like rate-limit backoff are
# handled inside the handler, not by redelivery (see src/jobs).
max_retries = 0

[ai]
binding = "AI"
remote = true

[images]
binding = "IMAGES"

[vars]
# Pins process.env.NODE_ENV in production (Workers defaults to "production"
# anyway, but be explicit). `.env.local` overrides it to "development" for
# wrangler dev, which is the ONLY thing that enables the /auth/dev-login
# bypass — see routes/auth.ts.
NODE_ENV = "production"
AUTH_EMAIL_FROM = "noreply@scorecard.wg.gay"
AI_GATEWAY_ID = "scorecard"
WEBAUTHN_RP_NAME = "Scorecard"
# Origins passkeys may be registered/used from. rpID/expectedOrigin are derived
# from the request Origin validated against this list, so this is PRODUCTION
# ONLY — a localhost entry here would let anything spoofing that Origin run a
# ceremony against prod under rpID "localhost". Local dev and phone tunnels
# override the whole list in `.env.local`, e.g.
# WEBAUTHN_ALLOWED_ORIGINS=http://localhost:5173,https://<name>.ngrok-free.app
WEBAUTHN_ALLOWED_ORIGINS = "https://scorecard.wg.gay"

# Secrets the Worker requires. Local values come from the repo-root
# `.env.local` (the only env file in this repo — wrangler dev reads it since
# no .dev.vars exists); production values via `wrangler secret put`.
# AI_GATEWAY_TOKEN also lives in .env.local but is eval-only (see
# pkg/api/src/model_provider.ts's evalModel), not a Worker secret.
[secrets]
required = ["JWT_SECRET", "AUTHN_CHALLENGE_SIGNING_SECRET", "GOLFCOURSE_API_KEY"]

[observability]
traces = { enabled = true }
logs = { enabled = true }
