name = "scorecard"
main = "pkg/api/server.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
account_id = "dfd083c9490364800d31a6e3a745ad6c"

[assets]
directory = "pkg/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scorecard"
database_id = "d4bcf0fb-b79d-42bf-b7d7-4820fbe8ce30"
migrations_dir = "pkg/api/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "scorecard"

[[kv_namespaces]]
binding = "AUTH_CODES"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "817364291"

  [ratelimits.simple]
  # The native binding's shortest window is 10 seconds; KV adds the exact 1-second throttle.
  limit = 10
  period = 10

[[send_email]]
name = "EMAIL"

[vars]
AUTH_EMAIL_FROM = "noreply@scorecard.wg.gay"

[observability]
enabled = true
