name = "scorecard"
main = "pkg/api/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
account_id = "dfd083c9490364800d31a6e3a745ad6c"

[assets]
directory = "pkg/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scorecard"
database_id = "d4bcf0fb-b79d-42bf-b7d7-4820fbe8ce30"
migrations_dir = "pkg/api/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "scorecard"

[[kv_namespaces]]
binding = "AUTH_CODES"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "817364291"

[ratelimits.simple]
# Throttle authentication-code requests.
limit = 10
period = 10

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@scorecard.wg.gay"]

[[queues.producers]]
binding = "CAPTURE_QUEUE"
queue = "scorecard-capture"

[[queues.consumers]]
queue = "scorecard-capture"
# One capture at a time, no batching: dispatch each message as soon as it arrives.
max_batch_size = 1
max_batch_timeout = 0
# Allows retrying rate-limited vision-model calls (see scorecard_parse_agent.ts).
max_retries = 3
retry_delay = 30

[ai]
binding = "AI"
remote = true

[images]
binding = "IMAGES"

[vars]
AUTH_EMAIL_FROM = "noreply@scorecard.wg.gay"
AI_GATEWAY_ID = "scorecard"

# Secrets the Worker requires. Local values come from the repo-root
# `.env.local` (the only env file in this repo — wrangler dev reads it since
# no .dev.vars exists); production values via `wrangler secret put`.
# AI_GATEWAY_TOKEN also lives in .env.local but is eval-only (see
# pkg/api/src/model_provider.ts's evalModel), not a Worker secret.
[secrets]
required = ["JWT_SECRET"]

[observability]
traces = { enabled = true }
logs = { enabled = true }
