# Course seed data. Upserted by script/update_seed.nu.
#
# Courses upsert by id; sets by (course, name) and holes by (set, number) —
# the ids below are only used on first insert, so hand-created rows with the
# same natural keys keep their ids and nothing double-inserts.
courses:
  - id: 019f7224-8600-7a93-b371-af4ba7a96372
    name: Buck Hill Falls Golf Course
    location: Buck Hill Falls, PA
    ncrdb_facility_id: 20114
    # The NCRDB (ncrdb.usga.org) knows the facility as 20114 and rates it as
    # three 18-hole nine-combinations: 21162 = White/Blue, 21163 = Blue/Red,
    # 21164 = Red/White. Each nine carries the CourseID of the combo it
    # fronts; its per-tee 9-hole ratings are that combo's Front(9) splits.
    #
    # App tees map onto BHF's rated markers (men's ratings) as:
    #   back -> Blue markers (the longest set — BHF has no tips),
    #   standard -> White (the everyday card the hole pars come from),
    #   senior -> Gold, front -> Red, junior -> Green.
    # Unmapped tees (tips, and any unrated pick) fall back to standard.
    sets:
      - id: 019f7224-8600-7909-9260-233d35044908
        name: White
        disposition: front
        ncrdb_course_id: 21162
        ratings:
          - {
