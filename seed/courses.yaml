# gender); holes by (tee, number). EVERY row's id is hardcoded below and is
# only used on first insert — hand-created rows with the same natural keys
# keep their ids and nothing double-inserts. Holes live PER TEE (par can
# differ by tee position); exact per-tee pars and ratings will be
# re-upserted by the planned USGA scraper.
